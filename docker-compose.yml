# Local and evaluation stack. For production use docker-compose.production.yml
# (`npm run docker:prod:up`), which adds an internal-only network and a
# password-protected Redis.
#
# Secrets have no defaults here on purpose: every default in this file is
# public, and a default signing key lets anyone who has read it sign in as any
# user. Copy .env.docker.example to .env.docker and fill it in.
name: rabbitflow

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rabbitflow-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:4080}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:4080}
      DATABASE_URL: ${DATABASE_URL:-postgresql://rabbitflow:rabbitflow@postgres:5432/rabbitflow?schema=public}
      DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-20}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - generate with openssl rand -base64 48}
      RUN_BOOTSTRAP_SEED: ${RUN_BOOTSTRAP_SEED:-true}
      # No defaults: the bootstrap seed refuses to create an administrator
      # without both, rather than creating one anybody could sign in as.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-RabbitFlow Admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      MFA_ISSUER: ${MFA_ISSUER:-RabbitFlow}
      MFA_CHALLENGE_TTL_SECONDS: ${MFA_CHALLENGE_TTL_SECONDS:-600}
      PASSWORD_RESET_OTP_TTL_SECONDS: ${PASSWORD_RESET_OTP_TTL_SECONDS:-600}
      MFA_REQUIRE_ENROLLMENT: ${MFA_REQUIRE_ENROLLMENT:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-RabbitFlow <no-reply@rabbitflow.local>}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set - generate with openssl rand -hex 32}
    restart: unless-stopped

  # Cron scheduler – calls /api/cron every 2 minutes to run SLA breach
  # checks and recurring task execution.
  cron:
    image: alpine:3.20
    container_name: rabbitflow-cron
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set - generate with openssl rand -hex 32}
      APP_INTERNAL_URL: http://app:3000
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        cat <<EOF | crontab -
        SHELL=/bin/sh
        PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        */2 * * * * /usr/bin/wget -qO- -T 60 --post-data='' --header='x-cron-secret: $${CRON_SECRET}' "$${APP_INTERNAL_URL}/api/cron" > /proc/1/fd/1 2>&1
        EOF
        echo "Cron scheduler started (every 2 min)"
        crond -f -l 6
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: rabbitflow-nginx
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-4080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: rabbitflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rabbitflow}
      POSTGRES_USER: ${POSTGRES_USER:-rabbitflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rabbitflow}
    ports:
      # Loopback only: reachable from this machine for local tools, not from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rabbitflow-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      # Loopback only, like Postgres. This Redis has no password.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    name: rabbitflow_postgres_data
  redis_data:
    name: rabbitflow_redis_data
