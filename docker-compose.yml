name: rabbitflow

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rabbitflow-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:4080}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:4080}
      DATABASE_URL: ${DATABASE_URL:-postgresql://rabbitflow:rabbitflow@postgres:5432/rabbitflow?schema=public}
      DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-20}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret}
      RUN_BOOTSTRAP_SEED: ${RUN_BOOTSTRAP_SEED:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-rabbittech46@gmail.com}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-RabbitFlow Admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-replace-with-a-strong-admin-password}
      MFA_ISSUER: ${MFA_ISSUER:-RabbitFlow}
      MFA_CHALLENGE_TTL_SECONDS: ${MFA_CHALLENGE_TTL_SECONDS:-600}
      PASSWORD_RESET_OTP_TTL_SECONDS: ${PASSWORD_RESET_OTP_TTL_SECONDS:-600}
      MFA_REQUIRE_ENROLLMENT: ${MFA_REQUIRE_ENROLLMENT:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-RabbitFlow <no-reply@rabbitflow.local>}
      CRON_SECRET: ${CRON_SECRET:-default-cron-secret-change-me}
    restart: unless-stopped

  # Cron scheduler – calls /api/cron every 2 minutes to run SLA breach
  # checks and recurring task execution.
  cron:
    image: alpine:3.20
    container_name: rabbitflow-cron
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:-default-cron-secret-change-me}
      APP_INTERNAL_URL: http://app:3000
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl > /dev/null 2>&1
        echo "*/2 * * * * curl -sf -X POST -H 'x-cron-secret: '\"$$CRON_SECRET\" \"$$APP_INTERNAL_URL/api/cron\" > /proc/1/fd/1 2>&1" | crontab -
        echo "Cron scheduler started (every 2 min)"
        crond -f -l 6
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: rabbitflow-nginx
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-4080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: rabbitflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rabbitflow}
      POSTGRES_USER: ${POSTGRES_USER:-rabbitflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rabbitflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rabbitflow-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    name: rabbitflow_postgres_data
  redis_data:
    name: rabbitflow_redis_data
