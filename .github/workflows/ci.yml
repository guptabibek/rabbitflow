name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rabbitflow_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test -d rabbitflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      REDIS_TEST_URL: redis://localhost:6379
      # Disposable runner-only database, never deployment credentials.
      DATABASE_URL: postgresql://test:test@localhost:5432/rabbitflow_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/rabbitflow_test
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate ephemeral runner keys
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm test
      - run: npm run test:integration
      - run: node --test --experimental-strip-types tests/runtime/redis-recovery.test.ts
      - run: node --test --experimental-strip-types tests/runtime/smtp-tls.test.ts
      - run: node --test --experimental-strip-types tests/runtime/registration-mfa.test.ts
      - run: npm run build
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test tests/marketing/build.test.mjs
      - run: python3 scripts/check-launch-docs.py
      - run: node scripts/build-marketing.mjs /tmp/rabbitflow-site
  browser-e2e:
    needs: verify
    runs-on: ubuntu-24.04
    # Cold browser/OS dependency installation took 11 minutes on a real runner;
    # leave time for the complete 158-case matrix and the focused auth gate.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rabbitflow_e2e_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test -d rabbitflow_e2e_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/rabbitflow_e2e_test
      APP_URL: http://127.0.0.1:3000
      REDIS_URL: redis://localhost:6379
      E2E_FULL_MATRIX: "true"
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate ephemeral runner keys
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify signup, MFA and login before the full matrix
        run: npm run test:e2e -- --grep Authentication --project=chromium --project=firefox --project=webkit --reporter=list,github --max-failures=1
      - run: npm run test:e2e -- --reporter=list,github
